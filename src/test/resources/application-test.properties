
spring.application.name=aws-integration-lab-test

# AWS
aws.region=sa-east-1

# Credenciais ficticias exclusivas do ambiente LocalStack de testes
aws.access-key=integration-test-key
aws.secret-key=integration-test-secret

# AMAZON S3
aws.s3.bucket=aws-integration-lab-test


# AWS STS

aws.sts.role-arn=arn:aws:iam::000000000000:role/aws-integration-lab-s3-test-role
aws.sts.role-session-name=aws-integration-test-session
